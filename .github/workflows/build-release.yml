name: Build release binaries

# A pushed v* tag is a release: the first job creates the GitHub release for it
# (text = the annotated tag message) unless one exists already, then one job
# per Asterisk major and Sangoma image builds chan_sccp.so and attaches it:
# sng12 (Debian 12) for Asterisk 18-23, sng7 (CentOS 7) for 18 and 20.
# Manual runs against an existing tag rebuild and re-attach (--clobber).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and attach the binaries to (e.g. v4.4.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: GitHub release for the tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create the release from the tag unless it exists
        run: |
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # GitHub turns a release into a draft when its tag is deleted or moved;
            # uploads to a draft succeed but nobody can see them. Publish it again.
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "release $TAG is a draft - publishing it"
              gh release edit "$TAG" --repo "$REPO" --draft=false
            else
              echo "release $TAG exists"
            fi
            exit 0
          fi
          # The release text is the annotated tag's message. This job has no
          # checkout, so read it through the API rather than from git.
          TYPE=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
            gh api "repos/$REPO/git/tags/$SHA" --jq '.message' > notes.md
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
          fi

  # One binary per Asterisk major that FreePBX 17 (Debian 12, "sng12") ships.
  # The headers come from the same apt repo the target boxes use, so the
  # module is built against exactly the Asterisk build it will load into.
  build-sng12:
    name: chan_sccp.so (Asterisk ${{ matrix.ast }} / sng12, Debian 12)
    needs: release
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        ast: [18, 20, 21, 22, 23]
    steps:
      - name: Install base build tools and the GitHub CLI
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl gnupg git build-essential autoconf automake gettext file
          # The job runs inside a plain debian container, which has no `gh`;
          # the upload step below needs it. Same apt source GitHub documents.
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gh

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Add FreePBX apt repo (source of asterisk${{ matrix.ast }}-devel)
        run: |
          cp .github/keys/freepbx-repo.gpg /etc/apt/trusted.gpg.d/freepbx.gpg
          echo "deb [arch=amd64] http://deb.freepbx.org/freepbx17-prod bookworm main" \
            > /etc/apt/sources.list.d/freepbx.list
          apt-get update

      # libssl-dev is deliberately absent: the experimental TLS transport
      # (port 2443) is unreviewed and unsupported, so release binaries are
      # built without it on every target. Verified 2026-09-11: the only
      # symbols a stand build with OpenSSL adds are SSL_*/ERR_*.
      - name: Install asterisk${{ matrix.ast }}-devel (must match the target Asterisk build exactly)
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y asterisk${{ matrix.ast }}-devel

      - name: Configure (no version flag - the release must prove autodetection works)
        run: |
          ./tools/bootstrap.sh
          # No options, like the README: conferencing and video are on by default
          # in this tree's configure. (--enable-advanced-functions adds nothing
          # usable, --enable-distributed-devicestate is a no-op on Asterisk 13+.)
          ./configure | tee configure.log
          # 1<major>00 is what a packaged Asterisk yields; anything else means
          # detection picked the wrong wrapper and the .so would be wrong too.
          grep -q "Found 'Asterisk Version 1${{ matrix.ast }}" configure.log \
            || { echo "Asterisk version autodetection did not land on ${{ matrix.ast }}"; grep "Asterisk Version" configure.log; exit 1; }

      - name: Build chan_sccp.so
        run: make -j2

      - name: Package binary
        run: |
          mkdir -p dist
          cp src/.libs/chan_sccp.so dist/chan_sccp-ast${{ matrix.ast }}-sng12.so
          file dist/chan_sccp-ast${{ matrix.ast }}-sng12.so | grep -q 'ELF 64-bit'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # --repo is required: gh would otherwise infer the repository from the
        # git remote, and git in the container refuses the checkout directory
        # ("detected dubious ownership") because it is owned by another uid.
        run: gh release upload "$TAG" dist/chan_sccp-ast${{ matrix.ast }}-sng12.so --clobber --repo "${{ github.repository }}"

  # FreePBX 16 (CentOS 7 based, "sng7") ships Asterisk 18 and 20. CentOS 7 is
  # end of life and its own repositories are gone, but Sangoma still serves
  # the sng7 packages (including asteriskNN-devel) from its mirrors, so the
  # build runs in a stock centos:7 container pointed at them. Node-based
  # actions (checkout, upload-artifact) cannot run on CentOS 7's glibc 2.17;
  # git and a static gh binary do the same job.
  build-sng7:
    name: chan_sccp.so (Asterisk ${{ matrix.ast }} / sng7, CentOS 7)
    needs: release
    runs-on: ubuntu-latest
    container: centos:7
    strategy:
      fail-fast: false
      matrix:
        ast: [18, 20]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Point yum at Sangoma's mirrors (stock CentOS 7 repos are gone)
        run: |
          rm -f /etc/yum.repos.d/CentOS-*.repo
          {
            echo '[sng-base]'
            echo 'name=Sangoma-$releasever - Base'
            echo 'mirrorlist=http://mirrorlist.sangoma.net/?release=$releasever&arch=$basearch&repo=os&dist=$dist&staging=$staging'
            echo 'gpgcheck=0'
            echo ''
            echo '[sng-updates]'
            echo 'name=Sangoma-$releasever - Updates'
            echo 'mirrorlist=http://mirrorlist.sangoma.net/?release=$releasever&arch=$basearch&repo=updates&dist=$dist&staging=$staging'
            echo 'gpgcheck=0'
            echo ''
            echo '[sng-extras]'
            echo 'name=Sangoma-$releasever - Extras'
            echo 'mirrorlist=http://mirrorlist.sangoma.net/?release=$releasever&arch=$basearch&repo=extras&dist=$dist&staging=$staging'
            echo 'gpgcheck=0'
            echo ''
            echo '[sng-pkgs]'
            echo 'name=Sangoma-$releasever - Sangoma Open Source Packages'
            echo 'mirrorlist=http://mirrorlist.sangoma.net/?release=$releasever&arch=$basearch&repo=sng7&dist=$dist&staging=$staging'
            echo 'gpgcheck=0'
            echo 'exclude=sangoma-pbx sangoma-release freepbx'
          } > /etc/yum.repos.d/sangoma.repo
          echo 'multilib_policy=best' >> /etc/yum.conf
          yum clean all

      - name: Align glibc with Sangoma's build
        # glibc-devel needs the exact glibc release from sng-base; the base
        # image ships a newer one, so downgrade instead of letting yum pull
        # in an i686 glibc to satisfy the version match.
        run: yum downgrade -y glibc glibc-common

      - name: Install build tools and asterisk${{ matrix.ast }}-devel
        # No 'file' here: it pulls file-libs.i686 and trips yum's protected
        # multilib check. readelf (binutils, via gcc) checks the ELF below.
        run: |
          yum install -y gcc make git asterisk${{ matrix.ast }}-devel || {
            echo "::group::yum repolist"; yum repolist; echo "::endgroup::"
            echo "::group::asterisk packages seen"; yum list available 'asterisk*' | head -40; echo "::endgroup::"
            exit 1
          }

      - name: Check out the tag (git, not actions/checkout)
        run: |
          git clone "https://github.com/${REPO}.git" .
          git checkout "$TAG"

      - name: Configure (no options - the release must prove autodetection works)
        run: |
          ./configure | tee configure.log
          grep -q "Found 'Asterisk Version 1${{ matrix.ast }}" configure.log \
            || { echo "Asterisk version autodetection did not land on ${{ matrix.ast }}"; grep "Asterisk Version" configure.log; exit 1; }

      - name: Build chan_sccp.so
        run: make -j2

      - name: Package binary
        run: |
          mkdir -p dist
          cp src/.libs/chan_sccp.so dist/chan_sccp-ast${{ matrix.ast }}-sng7.so
          readelf -h dist/chan_sccp-ast${{ matrix.ast }}-sng7.so | grep -q 'ELF64'

      - name: Upload to release (static gh binary, runs on glibc 2.17)
        run: |
          curl -fsSL -o gh.tgz https://github.com/cli/cli/releases/download/v2.40.0/gh_2.40.0_linux_amd64.tar.gz
          tar -xzf gh.tgz
          ./gh_2.40.0_linux_amd64/bin/gh release upload "$TAG" dist/chan_sccp-ast${{ matrix.ast }}-sng7.so --clobber --repo "$REPO"
